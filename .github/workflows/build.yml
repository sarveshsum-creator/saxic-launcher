name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build XI-Launcher.exe
        run: python build_exe.py

      - name: Checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/XI-Launcher.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  XI-Launcher.exe" | Out-File -Encoding ascii dist/XI-Launcher.exe.sha256
          $zipsum = (Get-FileHash dist/XI-Launcher-win64.zip -Algorithm SHA256).Hash.ToLower()
          "$zipsum  XI-Launcher-win64.zip" | Out-File -Encoding ascii dist/XI-Launcher-win64.zip.sha256
          Get-ChildItem dist/*.sha256 | ForEach-Object { Get-Content $_.FullName }

      - name: Publish to the "latest" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --title "XI Launcher (latest)" --notes "Automatic build of the current source. Download XI-Launcher.exe, or the share-ready zip, below." --latest
          } else {
            gh release edit latest --title "XI Launcher (latest)" --notes "Automatic build of the current source. Download XI-Launcher.exe, or the share-ready zip, below."
          }
          gh release upload latest dist/XI-Launcher.exe dist/XI-Launcher.exe.sha256 dist/XI-Launcher-win64.zip dist/XI-Launcher-win64.zip.sha256 --clobber
